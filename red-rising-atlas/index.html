<title>Red Rising Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D system behind three instruments: a top command bar, a left index of worlds, a right dossier. Single dark look by choice: it is space. */
:root{
  color-scheme:dark;
  --void:#05060b; --panel:rgba(12,14,24,.86); --panel-solid:#0c0e18; --line:rgba(214,178,94,.22);
  --ink:#ece6d6; --dim:#9a9686; --gold:#d6b25e; --red:#d1483a; --rim:#5fb7c9; --ref:#7d8496;
  --display:"Cinzel","Trajan Pro",Georgia,serif; --body:"Barlow","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:auto;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-shadow:0 0 6px #000,0 0 2px #000;padding:2px 6px;will-change:transform}
.lb small{color:var(--dim);margin-left:6px;letter-spacing:.02em;text-transform:none}
.lb.ref{color:var(--ref)}
.lb.site{font-family:var(--body);font-size:12px;letter-spacing:.02em;text-transform:none;font-weight:600;border-left:2px solid var(--gold);background:rgba(5,6,11,.62);border-radius:0 3px 3px 0}
.lb.site.battle{border-color:var(--red);color:#ffb4aa}
.lb.site.mine{border-color:#b0603a}
.lb.site.wild{border-color:var(--rim)}
.lb.on{color:var(--gold)}
.hud{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-columns:230px 1fr 380px;grid-template-rows:auto 1fr;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto;min-width:0}
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--panel);border:1px solid var(--line);padding:8px 14px;backdrop-filter:blur(8px)}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.14em;color:var(--gold);margin:0;text-transform:uppercase}
.brand span{color:var(--red)}
.grp{display:flex;align-items:center;gap:8px}
.grp>label,.cap{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{padding:5px 10px;font-size:12.5px;font-weight:500;color:var(--dim);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--gold);color:#17130a;font-weight:600}
.sp{flex:1}
.rail{grid-row:2;background:var(--panel);border:1px solid var(--line);overflow:auto;padding:8px 0;backdrop-filter:blur(8px);align-self:start;max-height:100%}
.rail button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 14px;font-size:13.5px}
.rail button.moon{padding-left:30px;font-size:12.5px;color:#cfc9b8}
.rail button:hover{background:rgba(214,178,94,.08)}
.rail button[aria-current="true"]{background:rgba(214,178,94,.16);color:var(--gold)}
.rail .tag{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ref);text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ref)}
.f-core{background:var(--gold)}.f-mars{background:var(--red)}.f-rim{background:var(--rim)}.f-ref{background:var(--ref)}
.legend{padding:10px 14px 4px;border-top:1px solid var(--line);margin-top:8px;display:grid;gap:4px;font-size:12px;color:var(--dim)}
.legend div{display:flex;align-items:center;gap:8px}
.mid{grid-row:2;grid-column:2;pointer-events:none;display:flex;align-items:flex-end;justify-content:center}
.hint{font-family:var(--mono);font-size:11px;color:var(--dim);background:rgba(5,6,11,.6);padding:4px 10px;margin:0}
.dossier{grid-row:2;grid-column:3;background:var(--panel);border:1px solid var(--line);overflow:auto;backdrop-filter:blur(8px);align-self:start;max-height:100%}
.dossier header{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel-solid);z-index:2}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.dossier h2{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.06em;margin:4px 0 2px;text-wrap:balance}
.tagline{margin:0;color:#d8d2c0}
.nav{display:flex;gap:6px;margin-top:10px}
.nav button{border:1px solid var(--line);padding:4px 9px;font-size:12px;color:var(--dim)}
.nav button:hover{color:var(--gold);border-color:var(--gold)}
#sheetToggle{display:none}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.sec p{margin:0 0 8px}.sec p:last-child{margin-bottom:0}
.note{color:var(--dim);font-size:12.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:10px 0 0}
.stats div{min-width:0}
.stats dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.stats dd{margin:0;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.cmp{display:flex;align-items:center;gap:14px}
.cmp svg{flex:none}
.strip{position:relative;height:34px;margin-top:12px}
.strip::before{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--line)}
.strip i{position:absolute;top:6px;width:7px;height:7px;border-radius:50%;background:var(--ref);transform:translateX(-50%)}
.strip i.e{background:#6fa8ff}.strip i.s{background:var(--gold);box-shadow:0 0 0 3px rgba(214,178,94,.25)}
.strip b{position:absolute;top:18px;font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--dim);transform:translateX(-50%);white-space:nowrap}
.strip b.l{transform:none}.strip b.r{transform:translateX(-100%)}
.rule{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.rule li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.bk{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:#17130a;background:var(--gold);padding:1px 5px;align-self:start;margin-top:2px}
.bk.b2{background:#c98a4b}.bk.b3{background:var(--red);color:#fff}
.chars{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.chars li{display:grid;grid-template-columns:10px 1fr;gap:9px}
.chars .c{width:10px;height:10px;border-radius:50%;margin-top:5px;border:1px solid rgba(255,255,255,.35)}
.chars strong{font-weight:600}
.chars em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-left:6px}
.chars span{display:block;color:#cfc9b8;font-size:13px}
.sites{display:grid;gap:6px}
.sites button{text-align:left;border:1px solid var(--line);padding:8px 10px;display:block;width:100%}
.sites button:hover,.sites button[aria-current="true"]{border-color:var(--gold);background:rgba(214,178,94,.08)}
.sites .t{display:flex;align-items:center;gap:8px;font-weight:600}
.sites .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-left:auto}
.sites span.d{display:block;color:#cfc9b8;font-size:13px;margin-top:2px}
.ev{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ev li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.ev strong{display:block;font-weight:600}
.ev span{color:#cfc9b8;font-size:13px}
@media (max-width:860px){
  .hud{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;gap:8px;padding-block:8px}
  .bar{padding:6px 10px;gap:6px 12px}.brand{font-size:15px}.sp{display:none}
  .rail{grid-row:2;display:flex;overflow-x:auto;padding:0;max-height:none}
  .rail button,.rail button.moon{width:auto;flex:none;padding:7px 10px;font-size:12.5px}
  .rail .tag,.legend{display:none}
  .mid{grid-row:3;grid-column:1}.hint{display:none}
  .dossier{grid-row:4;grid-column:1;max-height:44vh;align-self:end}
  .dossier.min{max-height:96px;overflow:hidden}
  .dossier h2{font-size:22px}
  #sheetToggle{display:inline-block}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

var FAC={core:{n:'Core, held by the Sovereign',c:0xd6b25e},mars:{n:'Mars, House Augustus',c:0xd1483a},rim:{n:'The Rim, Moon Lords',c:0x5fb7c9},ref:{n:'Shown for scale',c:0x7d8496}};
var BODIES=[

{id:'venus',name:'Venus',kind:'planet',fac:'core',au:0.723,km:6052,yr:0.615,atm:'#f3d89a',tex:{t:'gas',bands:5,turb:5,stops:[[0,[196,150,82]],[.5,[232,200,140]],[1,[250,236,200]]]},

{id:'earth',name:'Earth',kind:'planet',fac:'core',ref:1,au:1,km:6371,yr:1,atm:'#7fb4ff',tex:{t:'terra',sea:.5,seaC:[18,52,110],land:[[0,[60,104,52]],[.5,[128,120,72]],[1,[150,140,120]]],cap:72,clouds:.55},
 tag:'Your yardstick. Humanity started here.',

{id:'luna',name:'Luna',kind:'moon',parent:'earth',fac:'core',md:4.6,dkm:384400,km:1737,tex:{t:'rock',a:[70,72,80],b:[176,176,184]},lights:900,

   var p=n.clone().addScaledVector(t1,Math.cos(a)*rr).addScaledVector(t2,Math.sin(a)*rr).normalize();

   d.position.copy(p).multiplyScalar(1+hh/2+lift);d.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),p);

});

BODIES.forEach(function(b){

var cam={th:.9,ph:1.0,d:150,tth:.9,tph:1.0,td:150},tgt=new THREE.Vector3(),tmp=new THREE.Vector3(),tmp2=new THREE.Vector3(),tmp3=new THREE.Vector3(),tmp4=new THREE.Vector3(),modeT=0,clock=new THREE.Clock(),T=0;
function sysDist(){return state.mode?560:175;}
function minDist(){var b=BY[state.focus];return b.R*1.16;}
function focus(id,siteId,keepView){
 var b=BY[id],changed=state.focus!==id;state.focus=id;state.site=siteId||null;
 if(id==='sun'){if(changed||!keepView){cam.td=sysDist();cam.tph=1.0;}}
 else if(siteId){
  var s=b.sites.filter(function(x){return x.id===siteId;})[0];
  b.mesh.updateWorldMatrix(true,false);var d=tmp.copy(s.nv).applyQuaternion(b.mesh.getWorldQuaternion(new THREE.Quaternion())).normalize();
  var th=Math.atan2(d.z,d.x);cam.tth=th+Math.round((cam.th-th)/6.2832)*6.2832;cam.tph=Math.max(.08,Math.min(3.06,Math.acos(d.y)));cam.td=b.R*1.95;
 } else if(changed||!keepView){cam.td=b.R*(b.kind==='belt'?40:4.2);cam.tph=1.2;}
 try{history.replaceState(null,'','#'+id);}catch(e){}

}
function resize(){var w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

var ptrs={},drag=null,pinch=0;
canvas.addEventListener('pointerdown',function(e){canvas.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};drag={x:e.clientX,y:e.clientY,moved:0};pinch=0;});
canvas.addEventListener('pointermove',function(e){
 if(!ptrs[e.pointerId])return;var p=ptrs[e.pointerId],dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 var ids=Object.keys(ptrs);
 if(ids.length>=2){var a=ptrs[ids[0]],b=ptrs[ids[1]],dd=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)zoom(pinch/dd);pinch=dd;if(drag)drag.moved=99;return;}
 if(drag){drag.moved+=Math.abs(dx)+Math.abs(dy);cam.tth+=dx*.006;cam.tph=Math.max(.08,Math.min(3.06,cam.tph-dy*.006));}
});
function up(e){var d=drag;delete ptrs[e.pointerId];if(!Object.keys(ptrs).length){drag=null;pinch=0;if(d&&d.moved<6&&e.type==='pointerup')pick(e.clientX,e.clientY);}}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
function zoom(k){cam.td=Math.max(minDist(),Math.min(9000,cam.td*k));}
canvas.addEventListener('wheel',function(e){e.preventDefault();zoom(Math.exp(e.deltaY*.0012));},{passive:false});
function pick(x,y){var best=null,bs=1e9,H=window.innerHeight,f=1/Math.tan(camera.fov*Math.PI/360);
 BODIES.forEach(function(b){if(b.el.hidden)return;b.grp.getWorldPosition(tmp);var dist=tmp.distanceTo(camera.position);tmp.project(camera);if(tmp.z>1)return;
  var sx=(tmp.x*.5+.5)*window.innerWidth,sy=(-tmp.y*.5+.5)*H,rp=Math.max(16,b.R/dist*f*H/2),d=Math.hypot(sx-x,sy-y);
  if(d<rp&&dist<bs&&!(b.id===state.focus&&b.id!=='sun')){bs=dist;best=b;}});
 if(best)focus(best.id);}
window.addEventListener('keydown',function(e){if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key==='Escape')focus('sun');});

/* ---------- FRAME ---------- */
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(){
 var dt=Math.min(.05,clock.getDelta()),k=reduce?1:1-Math.exp(-dt*4.5);
 var free=state.focus==='sun'&&!reduce;if(free)T+=dt;
 modeT+=(state.mode-modeT)*k;var e=modeT*modeT*(3-2*modeT);
 BODIES.forEach(function(b){
  if(b.kind==='star')return;
  if(b.parent){var a=b.a0+T*.05/Math.sqrt(b.md);b.grp.position.set(Math.cos(a)*b.orbR,0,Math.sin(a)*b.orbR);}
  else{var r=rStory(b.au)+(rTrue(b.au)-rStory(b.au))*e,a2=b.a0+T*.02/b.yr;b.grp.position.set(Math.cos(a2)*r,0,Math.sin(a2)*r);if(b.orbit)b.orbit.scale.setScalar(r);
   if(b.kind==='belt'){var w=r*.09,pa=b.pts.geometry.attributes.position;for(var i=0;i<b.beltU.length;i++){var u=b.beltU[i],rr=r+u[1]*w,an=u[0]+T*.004;pa.setXYZ(i,Math.cos(an)*rr,u[2]*w*.25,Math.sin(an)*rr);}pa.needsUpdate=true;}}
  if(free&&b.mesh)b.mesh.rotation.y+=dt*.05;
 });
 BY.sun.mesh.rotation.y+=dt*.01;
 var fb=BY[state.focus];fb.grp.getWorldPosition(tmp);tgt.lerp(tmp,k);if(tgt.distanceTo(tmp)<1e-3)tgt.copy(tmp);
 cam.th+=(cam.tth-cam.th)*k;cam.ph+=(cam.tph-cam.ph)*k;cam.d=Math.exp(Math.log(cam.d)+(Math.log(cam.td)-Math.log(cam.d))*k);
 var sp=Math.sin(cam.ph);camera.position.set(tgt.x+cam.d*sp*Math.cos(cam.th),tgt.y+cam.d*Math.cos(cam.ph),tgt.z+cam.d*sp*Math.sin(cam.th));camera.lookAt(tgt);
 head.intensity+=((state.focus==='sun'?0:.55)-head.intensity)*k;
 scene.updateMatrixWorld();
 // labels
 var W=window.innerWidth,H=window.innerHeight;
 BODIES.forEach(function(b){
  b.grp.getWorldPosition(tmp);var dist=tmp.distanceTo(camera.position),show=true;
  if(b.parent){var P=BY[b.parent];P.grp.getWorldPosition(tmp2);show=(state.focus===b.id||state.focus===b.parent||BY[state.focus].parent===b.parent)||tmp2.distanceTo(camera.position)<P.R*26;}
  if(b.kind==='star'&&state.focus!=='sun')show=cam.d>30;
  var F=BY[state.focus];if(state.focus!=='sun'&&cam.d<F.R*9&&b!==F&&b.parent!==F.id&&F.parent!==b.id&&!(b.parent&&b.parent===F.parent))show=false;
  var near=state.focus===b.id&&cam.d<b.R*9;
  tmp2.copy(tmp).project(camera);
  if(!show||tmp2.z>1||Math.abs(tmp2.x)>1.1||Math.abs(tmp2.y)>1.1){b.el.hidden=true;}
  else{b.el.hidden=false;var f=1/Math.tan(camera.fov*Math.PI/360),rp=b.R/dist*f*H/2;
   b.el.style.transform='translate('+((tmp2.x*.5+.5)*W+Math.min(rp,W*.3)*.72+4).toFixed(1)+'px,'+((-tmp2.y*.5+.5)*H-Math.min(rp,H*.3)*.72-18).toFixed(1)+'px)';
   b.el.classList.toggle('on',state.focus===b.id);}
  b.sites.forEach(function(s){
   var vis=s.b<=state.book;s.grp.visible=vis;
   if(!vis||!near){s.el.hidden=true;return;}
   var wp=s.grp.localToWorld(tmp3.copy(s.nv).multiplyScalar(1.03));
   var facing=tmp2.copy(wp).sub(tmp).normalize().dot(tmp4.copy(camera.position).sub(tmp).normalize());
   if(facing<.22){s.el.hidden=true;return;}
   wp.project(camera);s.el.hidden=false;s.el.style.transform='translate('+((wp.x*.5+.5)*W+8).toFixed(1)+'px,'+((-wp.y*.5+.5)*H-10).toFixed(1)+'px)';
   s.el.classList.toggle('on',state.site===s.id);
  });
 });
 renderer.render(scene,camera);
 requestAnimationFrame(frame);
}

var railEl=document.getElementById('rail'),dosEl=document.getElementById('dossier'),sheetMin=false;
function renderRail(){
 var h='';BODIES.forEach(function(b){h+='<button id="nav-'+b.id+'" class="'+(b.parent?'moon':'')+'" data-id="'+b.id+'" aria-current="'+(state.focus===b.id)+'"><i class="dot f-'+b.fac+'"></i>'+b.name+(b.ref||b.fac==='ref'?'<span class="tag">scale</span>':'')+'</button>';});
 h+='<div class="legend">';Object.keys(FAC).forEach(function(k){h+='<div><i class="dot f-'+k+'"></i>'+FAC[k].n+'</div>';});h+='</div>';
 railEl.innerHTML=h;
 var cur=railEl.querySelector('[aria-current="true"]');if(cur&&cur.scrollIntoView&&window.innerWidth<=860)cur.scrollIntoView({block:'nearest',inline:'center'});
}
railEl.addEventListener('click',function(e){var b=e.target.closest('button[data-id]');if(b)focus(b.dataset.id);});
function fmt(n){return n>=100?Math.round(n).toLocaleString('en-US'):n.toFixed(n<10?2:1);}
function time(min){return min<1?(min*60).toFixed(1)+' sec':min<90?min.toFixed(1)+' min':(min/60).toFixed(1)+' hr';}
function bk(n){return '<span class="bk b'+n+'">'+['','I','II','III'][n]+'</span>';}
function scaleBlock(b){
 var ratio=b.km/6371,big=Math.max(ratio,1),er=Math.max(1.2,34/big),br=Math.max(1.2,34*ratio/big),clipB=br>34,w=150,h=88;
 var svg='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Size compared with Earth"><circle cx="40" cy="36" r="'+er.toFixed(1)+'" fill="#3f7fd6"/><circle cx="110" cy="36" r="'+Math.min(br,34).toFixed(1)+'" fill="'+(b.id==='earth'?'#3f7fd6':'#d6b25e')+'"/>'+
  '<text x="40" y="'+(h-1)+'" text-anchor="middle" font-size="9" fill="#9a9686" font-family="monospace">Earth</text><text x="110" y="'+(h-1)+'" text-anchor="middle" font-size="9" fill="#9a9686" font-family="monospace">'+(b.kind==='belt'?'Ceres':b.name.replace('The ',''))+'</text></svg>';
 var au=b.parent?BY[b.parent].au:b.au,line;
 if(b.kind==='star')line='<strong>109 Earths wide.</strong> Earth is the blue speck on the left.';
 else if(b.id==='earth')line='<strong>The baseline.</strong> 12,742 km across, 1 AU from the Sun (150 million km).';
 else line='<strong>'+(ratio>=1?fmt(ratio)+' times':Math.round(ratio*100)+'% of')+' Earth\'s width</strong>'+(b.kind==='belt'?' for Ceres, its largest rock.':'.')+(b.parent?' It orbits '+BY[b.parent].name+', '+BY[b.parent].au.toFixed(2)+' AU from the Sun.':au?' '+(au>1?fmt(au)+' times farther from the Sun than Earth.':Math.round(au*100)+'% of Earth\'s distance from the Sun.'):'');
 var st='<dl class="stats">';
 if(au){st+='<div><dt>From the Sun</dt><dd>'+au.toFixed(2)+' AU</dd></div><div><dt>In kilometers</dt><dd>'+fmt(au*149.6)+' million</dd></div><div><dt>Sunlight takes</dt><dd>'+time(au*8.317)+'</dd></div>';
  if(b.id!=='earth'&&b.id!=='luna')st+='<div><dt>Signal to Luna, closest</dt><dd>'+time(Math.abs(au-1)*8.317)+'</dd></div>';}
 if(b.dkm)st+='<div><dt>From '+BY[b.parent].name+'</dt><dd>'+fmt(b.dkm)+' km</dd></div>'+(b.id!=='luna'?'<div><dt>Versus Earth to Luna</dt><dd>'+(b.dkm/384400).toFixed(2)+' times</dd></div>':'<div><dt>Light from Earth</dt><dd>1.3 sec</dd></div>');
 st+='<div><dt>Diameter</dt><dd>'+fmt(b.km*2)+' km</dd></div>';if(b.yr)st+='<div><dt>One orbit</dt><dd>'+fmt(b.yr)+' Earth yr</dd></div>';st+='</dl>';

 strip+='<b class="l" style="left:0">Sun</b><b style="left:'+(5.2/40*100)+'%">Jupiter</b><b style="left:'+(19.2/40*100)+'%">Uranus</b><b class="r" style="left:100%">Pluto</b></div><p class="note">Planet distances drawn to true scale. Earth is the blue dot'+(au&&b.id!=='earth'?', this world is gold':'')+'.</p>';

}
function render(){
 var b=BY[state.focus],B=state.book,h='';
 h+='<header><div class="eyebrow"><i class="dot f-'+b.fac+'"></i>'+(b.kind==='moon'?'Moon of '+BY[b.parent].name:b.kind==='star'?'Star':b.kind==='belt'?'Asteroid belt':'Planet')+' &middot; '+FAC[b.fac].n+'</div><h2>'+b.name+'</h2><p class="tagline">'+b.tag+'</p>'+
  '<div class="nav"><button id="prev">&larr; Previous</button><button id="next">Next &rarr;</button><button id="sheetToggle">'+(sheetMin?'Open':'Minimize')+'</button></div></header>';
 h+='<div class="sec"><p>'+b.blurb+'</p>'+(b.ref?'<p class="note">Little or no role in books I to III. Included so you can judge scale and distance.</p>':'')+'</div>';

 var ch=(b.chars||[]).filter(function(c){return (c.b||1)<=B;});
 if(ch.length)h+='<div class="sec"><h3>Key characters</h3><ul class="chars">'+ch.map(function(c){return '<li><i class="c" style="background:'+CASTE[c.c]+'" title="'+c.c+'"></i><div><strong>'+c.n+'</strong><em>'+c.c+' &middot; '+c.tie+'</em><span>'+c.x+'</span></div></li>';}).join('')+'</ul></div>';
 var si=b.sites.filter(function(s){return s.b<=B;});

 if(hidden>0)h+='<div class="sec"><p class="note">'+hidden+' more '+(hidden===1?'entry is':'entries are')+' hidden to avoid spoilers. Raise "Spoilers through" to see '+(hidden===1?'it':'them')+'.</p></div>';
 if(b.id==='sun')h+='<div class="sec"><h3>How to read this map</h3><p>Gold orbits are Core worlds held by the Sovereign. Red is Mars. Teal is the Rim. Grey worlds are here for scale.</p><p>Story view squeezes the outer planets in so everything fits. True scale spaces the orbits correctly: zoom out and see how far the Rim really is. Planet sizes are enlarged in both views, so use the Earth comparison above for true size.</p></div>';
 dosEl.innerHTML=h;dosEl.classList.toggle('min',sheetMin);
 if(state.site){var cur=dosEl.querySelector('.sites [aria-current="true"]');if(cur&&window.innerWidth>860)cur.scrollIntoView({block:'nearest'});}else dosEl.scrollTop=0;
 document.getElementById('hint').textContent=b.sites.length&&b.id!=='sun'?'Drag to spin '+b.name+'. Scroll to zoom in on its cities.':'Drag to rotate. Scroll to zoom. Click a world or a place.';
}
dosEl.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
 if(t.dataset.site)focus(state.focus,t.dataset.site);else if(t.id==='prev')step(-1);else if(t.id==='next')step(1);else if(t.id==='sheetToggle'){sheetMin=!sheetMin;render();}});
function syncBar(){
